name: Crawler behavior report
description: Report unexpected JoshBot crawling or robots behavior
title: "[Crawler]: "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting unexpected JoshBot crawler behavior.

        Crawler reports are welcome even when your robots.txt configuration appears correct. This form creates a public GitHub issue.

        Do not include credentials, private server logs, sensitive
        infrastructure details, access tokens, private keys, or personal
        information.

        Security vulnerabilities must be reported privately through GitHub
        Private Vulnerability Reporting instead.

  - type: input
    id: origin
    attributes:
      label: Affected origin
      description: Provide the scheme and hostname JoshBot visited.
      placeholder: https://example.com
    validations:
      required: true

  - type: input
    id: request_time
    attributes:
      label: Approximate request time
      description: Include the date, time, and time zone if known.
      placeholder: 2026-09-05 14:30 PDT
    validations:
      required: true

  - type: input
    id: path
    attributes:
      label: Requested path
      description: Provide the requested path if it is relevant to the report.
      placeholder: /example/page

  - type: input
    id: user_agent
    attributes:
      label: Observed JoshBot User-Agent
      description: Copy the User-Agent recorded by your server.
      placeholder: Joshternet-Joshbot (+https://joshternet.org/joshbot)
    validations:
      required: true

  - type: textarea
    id: robots
    attributes:
      label: Relevant robots.txt
      description: Include only the relevant public robots.txt rules.
      render: text

  - type: textarea
    id: problem
    attributes:
      label: What behavior appeared wrong?
      description: Explain what JoshBot did and why the behavior was unexpected.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Explain what you expected JoshBot to do instead.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Reporter checks
      options:
        - label: I searched existing issues for a similar crawler report.
          required: true
        - label: I removed credentials, private logs, and sensitive infrastructure details.
          required: true
        - label: This report can be discussed publicly.
          required: true
        - label: This is not an undisclosed security vulnerability.
          required: true